[project]
name = "sam3-gpu-worker"
version = "0.1.0"
description = "FastAPI + SAM 3.1 live video inference worker for AWS GPU spot instances"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.12",
]

[tool.uv]
dev-dependencies = [
    "watchfiles>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
